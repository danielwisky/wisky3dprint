# Projects not printed yet (hidden page /projetos/).
#
# Fields of each project (values shown on the site stay in Portuguese):
#   - name:     card title, also used by the search.
#   - category: becomes a filter chip at the top of the page.
#   - designer: who made the model (e.g. "Whale3D"); becomes a chip in the
#               "Modelador:" row.
#   - versions: Regular and/or Knitted (shown as "lisa" / "tricô").
#   - image:    photo in assets/img/projects/ (webp, up to 400px, quality 72),
#               named <category-in-english>-<name>.webp.
#
# The order below is the order on the page: Pokémon follow the Pokédex, the
# other categories start with the main character, and "Outros" goes last.

# Extra search terms per category, so searching the English (or original)
# title still finds the projects after the category was translated.
category_search_terms:
  "Ataque dos Titãs": "Attack on Titan Shingeki no Kyojin"
  "Como Treinar o Seu Dragão": "How to Train Your Dragon"
  "Demon Slayer": "Kimetsu no Yaiba"
  "Disney": "Pixar"
  "Grinch": "Natal"
  "Guerreiras do K-Pop": "K-Pop Demon Hunters Huntrx"
  "Hello Kitty": "Sanrio"
  "Mario": "Super Mario Nintendo"
  "Patrulha Canina": "Paw Patrol"
  "Snoopy": "Peanuts"
  "Super-heróis": "Super Hero Marvel DC"
  "Toy Story": "Pixar"
  "Ursinho Pooh": "Winnie the Pooh"
  "Zelda": "Nintendo"

