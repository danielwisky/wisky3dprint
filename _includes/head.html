<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#070b12">

  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#faf6f1' : '#070b12');
    })();

    (function () {
      var ativo = false;
      try {
        if (new URLSearchParams(location.search).has('acesso-vip')) localStorage.setItem('ferramentas', '1');
        {%- if page.pwa %}
        // Quem abre uma ferramenta é maker: libera o menu aqui e no resto do
        // site, inclusive pra quem chegou pelo Google sem o ?acesso-vip.
        // Também cobre o app instalado no iPhone, que não compartilha o
        // localStorage do Safari.
        localStorage.setItem('ferramentas', '1');
        {%- endif %}
        ativo = localStorage.getItem('ferramentas') === '1';
      } catch (e) {}
      if (ativo) document.documentElement.setAttribute('data-ferramentas', '');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=optional" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=optional"></noscript>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ '/assets/css/style.scss' | asset_hash }}">
  {%- if page.pwa %}
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  {%- endif %}

  {%- if page.noindex %}
  <meta name="robots" content="noindex, nofollow">
  {%- endif %}
  {% seo %}
  {% include structured-data.html %}
  {% include google-analytics.html %}

  {%- unless page.peca %}
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  {%- endunless %}
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}?v={{ '/assets/img/favicon.svg' | asset_hash }}">
  <link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/img/favicon.ico' | relative_url }}?v={{ '/assets/img/favicon.ico' | asset_hash }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}?v={{ '/assets/img/apple-touch-icon.png' | asset_hash }}">

  {%- if page.pwa %}
  <link rel="manifest" href="{{ '/manifest-orcamento.webmanifest' | relative_url }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wisky 3D">
  {%- else %}
  <meta name="apple-mobile-web-app-title" content="{{ site.title }}">
  <meta name="application-name" content="{{ site.title }}">
  {%- endif %}
</head>
