<div class="colorize3mf calc" id="colorize3mf">
  <div class="calc-field calc-field-upload">
    <span class="calc-field-label-sr" id="colorize3mf-upload-label">Arquivo do modelo (STL ou 3MF)</span>
    <label for="colorize3mf-upload" class="calc-dropzone" id="colorize3mf-dropzone">
      <span class="calc-dropzone-text" id="colorize3mf-dropzone-text">Arraste o arquivo .stl ou .3mf aqui ou <span class="calc-dropzone-link">escolha um arquivo</span></span>
      <span class="calc-dropzone-loading" id="colorize3mf-loading" hidden>Lendo o arquivo, aguarde...</span>
    </label>
    <input type="file" id="colorize3mf-upload" accept=".stl,.3mf" aria-labelledby="colorize3mf-upload-label">
  </div>
  <p class="calc-model-error" id="colorize3mf-error" role="alert" hidden></p>

  <div id="colorize3mf-panel" hidden>
    <p class="colorize3mf-hint">Arraste com o botão esquerdo para girar o modelo. Clique numa superfície para pintar com a ferramenta ativa.</p>

    <div class="colorize3mf-tabs" id="colorize3mf-tabs" role="tablist" aria-label="Chapas" hidden></div>

    <div class="colorize3mf-workspace">
      <div class="colorize3mf-canvas-wrap">
        <canvas id="colorize3mf-canvas" aria-label="Visualização 3D do modelo"></canvas>
        <button type="button" class="colorize3mf-recenter" id="colorize3mf-recenter" title="Recentralizar vista" aria-label="Recentralizar vista">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9V5a1 1 0 0 1 1-1h4"></path>
            <path d="M20 9V5a1 1 0 0 0-1-1h-4"></path>
            <path d="M4 15v4a1 1 0 0 0 1 1h4"></path>
            <path d="M20 15v4a1 1 0 0 1-1 1h-4"></path>
          </svg>
        </button>
        <div class="colorize3mf-large-warning" id="colorize3mf-large-warning" hidden>
          <span id="colorize3mf-large-warning-text"></span>
          <button type="button" class="colorize3mf-large-warning-close" id="colorize3mf-large-warning-close" aria-label="Fechar aviso">&times;</button>
        </div>
      </div>

      <div class="colorize3mf-toolbar">
        <div class="colorize3mf-tool-group" role="radiogroup" aria-label="Ferramenta de pintura">
          <button type="button" class="colorize3mf-tool is-active" id="colorize3mf-tool-bucket" role="radio" aria-checked="true" data-tool="bucket">
            Balde
          </button>
          <button type="button" class="colorize3mf-tool" id="colorize3mf-tool-magic" role="radio" aria-checked="false" data-tool="magic">
            Seleção mágica
          </button>
        </div>

        <div class="colorize3mf-palette-block">
          <div class="colorize3mf-palette-top">
            <span class="colorize3mf-palette-label" id="colorize3mf-palette-label">Cores</span>
            <button type="button" class="colorize3mf-palette-add" id="colorize3mf-palette-add" title="Adicionar cor" aria-label="Adicionar cor">+</button>
            <input type="color" id="colorize3mf-palette-new-color" class="colorize3mf-palette-new-color-hidden" tabindex="-1" aria-hidden="true">
          </div>
          <div class="colorize3mf-palette-list" id="colorize3mf-palette-list" role="group" aria-labelledby="colorize3mf-palette-label"></div>
        </div>

        <div class="calc-field" id="colorize3mf-tolerance-field" hidden>
          <label for="colorize3mf-tolerance">Tolerância (curvatura): <span id="colorize3mf-tolerance-value">15°</span></label>
          <input type="range" id="colorize3mf-tolerance" min="0" max="60" step="1" value="15">
        </div>

        <div class="colorize3mf-selection-actions" id="colorize3mf-selection-actions" hidden>
          <span class="colorize3mf-selection-count" id="colorize3mf-selection-count"></span>
          <button type="button" class="btn btn-gradient" id="colorize3mf-apply-selection" disabled>Aplicar cor</button>
          <button type="button" class="btn" id="colorize3mf-clear-selection" disabled>Limpar seleção</button>
        </div>

        <button type="button" class="btn" id="colorize3mf-undo" disabled>Desfazer</button>
        <button type="button" class="btn" id="colorize3mf-reset" disabled>Repintar tudo de cinza</button>
      </div>
    </div>

    <div class="calc-result-box colorize3mf-result">
      <button type="button" class="btn btn-gradient calc-add-btn" id="colorize3mf-export" disabled>Baixar 3MF colorido</button>
      <p class="colorize3mf-out" id="colorize3mf-out" aria-live="polite"></p>
    </div>
  </div>
</div>
