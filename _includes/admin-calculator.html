<form id="admin-calc" class="calc reveal"
  data-potencia-w="{{ site.calculadora.potencia_w }}"
  data-tarifa-kwh="{{ site.calculadora.tarifa_kwh }}"
  data-desgaste="{{ site.calculadora.desgaste }}"
  data-margem-pct="{{ site.calculadora.margem_pct }}">
  <div class="calc-fields">
    <div class="calc-field">
      <label for="admin-calc-peso">Peso da peça (g)</label>
      <input type="text" id="admin-calc-peso" name="peso" inputmode="decimal" autocomplete="off" placeholder="ex: 50">
    </div>
    <div class="calc-field">
      <label for="admin-calc-horas">Tempo de impressão</label>
      <div class="calc-fields calc-fields-time">
        <input type="number" id="admin-calc-horas" name="horas" min="0" inputmode="numeric" autocomplete="off" placeholder="Horas">
        <input type="number" id="admin-calc-minutos" name="minutos" min="0" max="59" inputmode="numeric" autocomplete="off" placeholder="Minutos">
      </div>
    </div>
    <div class="calc-field">
      <label for="admin-calc-filamento">Preço do filamento (R$/kg)</label>
      <input type="text" id="admin-calc-filamento" name="filamento" inputmode="decimal" autocomplete="off" placeholder="ex: {{ site.calculadora.custo_filamento_kg }}">
    </div>
    <div class="calc-field">
      <label for="admin-calc-mao-de-obra">Mão de obra (R$)</label>
      <input type="text" id="admin-calc-mao-de-obra" name="maoDeObra" inputmode="decimal" autocomplete="off" placeholder="ex: 20">
    </div>
    <div class="calc-field">
      <label for="admin-calc-margem">Margem (%)</label>
      <input type="text" id="admin-calc-margem" name="margem" inputmode="decimal" autocomplete="off" value="{{ site.calculadora.margem_pct }}">
    </div>
  </div>

  <div class="calc-breakdown" id="admin-calc-breakdown" hidden>
    <div class="calc-breakdown-row">
      <span>Filamento</span>
      <span id="admin-calc-b-filamento">—</span>
    </div>
    <div class="calc-breakdown-row">
      <span>Energia</span>
      <span id="admin-calc-b-energia">—</span>
    </div>
    <div class="calc-breakdown-row">
      <span>Desgaste da impressora</span>
      <span id="admin-calc-b-desgaste">—</span>
    </div>
    <div class="calc-breakdown-row">
      <span>Subtotal</span>
      <span id="admin-calc-b-subtotal">—</span>
    </div>
    <div class="calc-breakdown-row">
      <span id="admin-calc-b-margem-label">Margem</span>
      <span id="admin-calc-b-margem">—</span>
    </div>
    <div class="calc-breakdown-row">
      <span>Mão de obra</span>
      <span id="admin-calc-b-mao-de-obra">—</span>
    </div>
  </div>

  <div class="calc-result-box">
    <span class="calc-result-label">Total</span>
    <output id="admin-calc-result" class="calc-result" for="admin-calc-peso admin-calc-horas admin-calc-minutos admin-calc-filamento admin-calc-mao-de-obra admin-calc-margem" aria-live="polite">Preencha os campos</output>
  </div>
</form>
